[build]
builder = "railpack"
buildCommand = "pnpm install && pnpm --filter server run postinstall && pnpm --filter server run build"

[deploy]
startCommand = "pnpm --filter server run db:push && pnpm --filter server start"
healthcheckPath = "/health"
healthcheckTimeout = 100
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 10
